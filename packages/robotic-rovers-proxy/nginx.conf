events {}
http {
    server {
        listen 3000;

        location /api/ {
            rewrite ^/api/(.*)$ /$1 break;

            proxy_pass http://robotic-rovers-api:3001;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # used by Next.js for Hot Module Replacement (HMR):
        # live-updates in the browser during development
        location /_next/webpack-hmr {
            proxy_pass http://robotic-rovers-web:3002/_next/webpack-hmr; 
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }

        location / {
            proxy_pass http://robotic-rovers-web:3002;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }  
}